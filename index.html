<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4F5943"><link rel="manifest" href="manifest.webmanifest"><title>Meu Financeiro Offline</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#f5f6f2;color:#20231d}header{background:#151713;color:white;padding:18px}header small{display:block;color:#dde3d5;margin-top:4px}.wrap{max-width:620px;margin:auto;padding:14px}.card{background:white;border:1px solid #dde3d5;border-radius:14px;padding:16px;margin-bottom:12px}label{font-weight:700;font-size:14px;display:block;margin-top:10px}input,select,button{width:100%;font-size:18px;padding:12px;border:1px solid #9aa18e;border-radius:9px;margin-top:5px;background:white}button{background:#4f5943;color:white;border:0;font-weight:700;margin-top:14px}.alt{background:#d8c1ff;color:#20231d}.danger{background:#eee;color:#20231d}.row{padding:10px 0;border-bottom:1px solid #eee}.money{font-weight:800}.muted{color:#707a62;font-size:13px}.ok{color:#4f5943;font-weight:800}</style></head><body><header><b>Meu Controle Financeiro</b><small>Gastos rápidos — modo offline</small></header><div class="wrap">
<div class="card"><div class="ok">✓ Funciona sem internet depois de instalado</div><div class="muted">Os gastos ficam somente neste aparelho até você exportar e importar no computador.</div><button id="install" class="alt" hidden>Instalar no celular</button></div>
<div class="card"><h2>+ Gasto rápido</h2><form id="f"><label>Descrição</label><input id="descricao" required placeholder="Ex.: Uber"><label>Valor</label><input id="valor" inputmode="numeric" required placeholder="Ex.: 895 = R$ 8,95"><label>Data</label><input id="data" required><label>Pagamento</label><select id="pag"><optgroup label="Contas bancárias"><option>Banco|Itaú</option><option>Banco|Inter Pessoal</option><option>Banco|Inter Empresa</option><option>Banco|Caixa</option><option>Banco|Caju</option><option>Banco|Santander</option></optgroup><optgroup label="Cartões"><option>Cartão|Cartão de Crédito Inter Pessoal</option><option>Cartão|Cartão de Crédito Santander Smiles</option><option>Cartão|Credifatto</option></optgroup></select><label>Observação (opcional)</label><input id="obs"><button>Salvar no celular</button></form></div>
<div class="card"><h2>Pendentes no aparelho</h2><div id="lista"></div><button id="export" class="alt">Exportar para o computador (.json)</button><button id="clear" class="danger">Apagar somente os já exportados</button></div>
</div><script>
const KEY='cf_offline_v1'; const $=x=>document.getElementById(x); let deferred;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}} function save(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
function brdate(){let d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()} $('data').value=brdate();
function money(raw){let s=String(raw).replace(/\D/g,'');return Number(s||0)/100} function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function render(){let a=load();$('lista').innerHTML=a.length?a.map(x=>`<div class="row"><b>${esc(x.descricao)}</b><br><span class="money">${fmt(x.valor)}</span><div class="muted">${esc(x.data_gasto)} • ${esc(x.pagamento_nome)} • ${x.exportado?'✓ Exportado':'↑ Aguardando exportação'}</div></div>`).join(''):'<div class="muted">Nenhum lançamento pendente.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('f').onsubmit=e=>{e.preventDefault();let v=money($('valor').value);if(!v)return alert('Informe um valor maior que zero.');let [t,n]=$('pag').value.split('|');let a=load();a.unshift({id:'OFF-'+Date.now()+'-'+Math.random().toString(16).slice(2),criado_em:new Date().toISOString(),descricao:$('descricao').value.trim(),valor:v,data_gasto:$('data').value,observacao:$('obs').value.trim(),pagamento_tipo:t,pagamento_nome:n,exportado:false});save(a);$('descricao').value='';$('valor').value='';$('obs').value='';alert('✓ Gasto salvo no celular. Nenhuma conta bancária foi movimentada.')}
$('export').onclick=()=>{let a=load();if(!a.length)return alert('Não há lançamentos.');let blob=new Blob([JSON.stringify({app:'Controle Financeiro Offline',version:1,exportado_em:new Date().toISOString(),items:a},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='Gastos_Offline_'+new Date().toISOString().slice(0,10)+'.json';el.click();URL.revokeObjectURL(u);a.forEach(x=>x.exportado=true);save(a)};
$('clear').onclick=()=>{let a=load(),n=a.filter(x=>!x.exportado);if(a.length===n.length)return alert('Exporte os lançamentos antes de apagá-los.');if(confirm('Apagar do celular somente os lançamentos marcados como exportados?'))save(n)};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true}};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
